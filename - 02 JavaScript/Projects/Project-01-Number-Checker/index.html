<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Number Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="main">
        <h1>JavaScript Number Checker</h1>
        <h2>Enter a Number</h2>
        <input type="number" id="numberInput" placeholder="Enter Number">
        
        <div class="buttons">
            
            <button id="checkBtn">
                Check</button>
            <button id="resetBtn">
                Reset</button>
        </div>

        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
